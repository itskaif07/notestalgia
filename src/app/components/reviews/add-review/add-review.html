<form [formGroup]="reviewForm" (ngSubmit)="submitReview(noteId)"
    class="w-11/12 max-w-3xl mx-auto my-10 p-6 bg-[#1E1E1E] border border-white/20 text-white rounded-2xl shadow-2xl space-y-8 flex flex-col items-center">

    <!-- Heading -->
    <h2 class="text-2xl font-bold text-amber-400 tracking-wide text-center">Write a Review</h2>

    <!-- Star Rating -->
    <div class="flex flex-col items-center space-y-3 w-full">
        <label class="text-sm font-semibold tracking-wide text-gray-300">Rate this note</label>
        <div class="flex space-x-2 text-4xl text-gray-600 cursor-pointer">
            @for (star of [1, 2, 3, 4, 5]; track $index) {
            <span (click)="selectRating(star)" [ngClass]="{'text-amber-400': selectedRating >= star}"
                class="hover:text-amber-400 transition-all duration-200">★</span>
            }
        </div>
    </div>

    @if(errorMessage){
    <p class="text-red-500 text-sm">{{ errorMessage }}</p>
    }

    <!-- Textarea -->
    <div class="w-full md:w-2/3 flex flex-col space-y-2">
        <label class="text-sm font-semibold text-gray-300">Your Review</label>
        <textarea formControlName="review" placeholder="Share your thoughts..." rows="5" maxlength="500"
            class="w-full p-4 bg-[#2A2A2A] border border-white/20 rounded-lg outline-none resize-none text-sm text-white focus:border-amber-400"></textarea>

        @if(reviewForm.get('review')?.hasError('maxlength')) {
        <p class="text-xs text-red-500">Review cannot exceed 500 characters.</p>
        }
        <p class="text-xs text-gray-400 text-right">0/500</p>
    </div>

    <!-- Buttons -->
    <div class="flex justify-end space-x-4 pt-4 w-full md:w-2/3">
        <button type="button" (click)="cancelled.emit()"
            class="px-4 py-2 rounded bg-gray-600 hover:bg-gray-700 transition-all text-white text-sm cursor-pointer">
            Cancel
        </button>
        <button type="submit" [disabled]="selectedRating === 0"
            [ngClass]="{'opacity-50 cursor-not-allowed': selectedRating === 0 }"
            class="px-6 py-2 rounded bg-amber-400 text-black font-semibold hover:bg-amber-500 text-sm cursor-pointer transition-all">
            Submit
        </button>
    </div>
</form>
