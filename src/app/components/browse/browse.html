<div class="bg-[#1E1E1E] w-full flex items-start space-x-6 px-6 py-10 min-h-screen">
    <!-- Sidebar -->
    <div
        class="w-[20%] flex flex-col px-6 py-8 bg-[#2A2A2A] border border-[#333] rounded-2xl shadow-2xl text-white space-y-6">
        <h1 class="font-bold tracking-wide text-base uppercase text-amber-400">Categories</h1>

        <div class="space-y-3 w-full">
            @for (category of categoriesList; track $index) {
            <h2
                class="px-4 py-2 rounded-lg transition-all duration-200 ease-in-out hover:bg-amber-400/10 hover:text-amber-400 cursor-pointer w-full text-sm font-medium">
                {{ category }}
            </h2>
            }
        </div>
    </div>

    <!-- Main Content Area -->
    <div
        class="w-[80%] h-full flex flex-col items-center justify-center px-10 border border-[#333] rounded-2xl bg-[#252525] text-white">

        <div class="w-full h-24 flex items-center justify-between px-4 shadow-xl">

            <div class=" flex items-center justify-center space-x-4">
                <h1 class="text-amber-300">Sort By:</h1>
                <select name="" id="" class="outline-none">
                    <option value="Release Date" class="text-black">Release Date</option>
                    <option value="Name: A to Z" class="text-black">Name: A to Z</option>
                    <option value="Name: Z to A" class="text-black">Name: Z to A</option>
                </select>
            </div>

            <div class="border border-[#ccc] rounded-2xl w-2/5 flex items-center justify-center h-3/5 space-x-6">
                <img src="assets/search.png" alt="" class="w-5">
                <input type="search" name="" id="searchInput"
                    class="h-full outline-none w-4/5 bg-transparent active:bg-transparent hover:bg-transparent placeholder:text-gray-500"
                    placeholder="Search Notes...">
            </div>
        </div>

        <div
            class="w-full h-full flex items-center justify-between px-4 shadow-2xl flex-wrap py-10 space-x-3 space-y-10">
            @if (notesList !== null) {
            @for (note of notesList; track $index) {
            <div class="w-[30%] h-96 rounded-xl cursor-pointer bg-center bg-cover flex justify-center  relative hover:shadow-xl hover:scale-105 transform transition-all duration-200 ease-out"
                [ngStyle]="{ 'background-image': 'url(' + (note.thumbnail ? note.thumbnail : 'assets/thumbnail.jpg') + ')' }">
                <div class="absolute bg-black/30 backdrop-blur-sm h-1/3 w-full bottom-0 left-0">
                    <!-- Optional content inside overlay -->
                    <div class="flex flex-col items-start justify-center h-full text-white text-xl font-semibold px-6">
                        <h1 class="font-medium">{{note.title || ''}}</h1>
                        <p class="text-sm">{{note.category || ''}} | {{note.level || ''}} | {{note.subject || ''}}</p>
                        <h3 class="text-[#72E8A3] font-semibold">₹ 30</h3>
                    </div>
                </div>
            </div>

            }
            }

        </div>

    </div>
</div>
